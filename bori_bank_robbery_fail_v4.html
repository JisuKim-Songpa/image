<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>보리 투자 은행 - 은행털기 실패</title>
  <meta name="description" content="냥경비가 냥도둑을 검거하는 어둡고 긴장감 있는 실패 카드." />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="보리 투자 은행 - 은행털기 실패" />
  <meta property="og:description" content="냥경비가 냥도둑을 검거하는 어둡고 긴장감 있는 실패 카드." />
  <meta property="og:url" content="https://jisukim-songpa.github.io/image/bori_bank_robbery_fail_v4.html" />
  <meta property="og:image" content="https://jisukim-songpa.github.io/image/bori_bank_robbery_fail_v4.png" />
  <meta property="og:image:secure_url" content="https://jisukim-songpa.github.io/image/bori_bank_robbery_fail_v4.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="600" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="보리 투자 은행 - 은행털기 실패" />
  <meta name="twitter:description" content="냥경비가 냥도둑을 검거하는 어둡고 긴장감 있는 실패 카드." />
  <meta name="twitter:image" content="https://jisukim-songpa.github.io/image/bori_bank_robbery_fail_v4.png" />

  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fb;
      --card: rgba(255,255,255,.88);
      --text: #172033;
      --sub: #4b5b7a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
      color: var(--text);
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .wrap {
      width: min(100%, 1200px);
      position: relative;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(23,32,51,.14);
      background: #fff;
    }
    .boss-img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1200 / 600;
      object-fit: contain;
      background: #fff;
    }
    .caption {
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: 24px;
      padding: 18px 22px;
      border-radius: 22px;
      background: var(--card);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(23,32,51,.12);
    }
    .name {
      margin: 0 0 6px;
      font-size: clamp(24px, 3.1vw, 52px);
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: -0.04em;
    }
    .state {
      color: var(--sub);
      font-size: clamp(15px, 1.45vw, 25px);
      font-weight: 800;
      margin-left: 8px;
    }
    .line {
      margin: 0;
      font-size: clamp(17px, 1.9vw, 32px);
      line-height: 1.36;
      font-weight: 750;
      letter-spacing: -0.035em;
      word-break: keep-all;
    }
    @media (max-width:720px) {
      body { padding: 10px; }
      .wrap { border-radius: 18px; }
      .caption {
        left: 12px;
        right: 12px;
        bottom: 12px;
        padding: 12px 14px;
        border-radius: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap" aria-label="보리 투자 은행 - 은행털기 실패">
    <img class="boss-img" src="https://jisukim-songpa.github.io/image/bori_bank_robbery_fail_v4.png" alt="보리 투자 은행 - 은행털기 실패" />
    <section class="caption">
      <h1 class="name">보리 투자 은행<span class="state">은행털기 실패</span></h1>
      <p class="line">어두운 현장 속에서 냥경비가 출동해 냥도둑 검거를 완료했다냥!</p>
    </section>
  </main>
</body>
</html>
