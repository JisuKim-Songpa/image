<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>장비강화 대성공</title>
  <meta name="description" content="강렬한 광채 속에서 장비가 기대 이상으로 각성합니다." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="장비강화 대성공" />
  <meta property="og:description" content="강렬한 광채 속에서 장비가 기대 이상으로 각성합니다." />
  <meta property="og:url" content="https://jisukim-songpa.github.io/image/equipment_enhance_great_success_banner_v1.html" />
  <meta property="og:image" content="https://jisukim-songpa.github.io/image/equipment_enhance_great_success_banner_v1.png" />
  <meta property="og:image:secure_url" content="https://jisukim-songpa.github.io/image/equipment_enhance_great_success_banner_v1.png" />
  <meta property="og:image:width" content="1774" />
  <meta property="og:image:height" content="887" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="장비강화 대성공" />
  <meta name="twitter:description" content="강렬한 광채 속에서 장비가 기대 이상으로 각성합니다." />
  <meta name="twitter:image" content="https://jisukim-songpa.github.io/image/equipment_enhance_great_success_banner_v1.png" />
  <style>
    :root { --bg:#eef2f7; --card:#ffffff; --text:#151922; --sub:#596275; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); padding:16px; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .wrap { width:min(1774px,100%); background:var(--card); border-radius:28px; overflow:hidden; box-shadow:0 18px 50px rgba(16,24,40,.16); position:relative; }
    .boss-img { display:block; width:100%; height:auto; }
    .caption { position:absolute; left:28px; right:28px; bottom:24px; padding:14px 18px; border-radius:18px; background:rgba(255,255,255,.78); backdrop-filter:blur(6px); }
    .name { margin:0; font-size:28px; color:var(--text); line-height:1.2; }
    .state { margin-left:10px; color:var(--sub); font-size:18px; font-weight:600; }
    .line { margin:6px 0 0; color:var(--sub); font-size:18px; }
    @media (max-width:720px) {
      body { padding:10px; }
      .wrap { border-radius:18px; }
      .caption { left:12px; right:12px; bottom:12px; padding:12px 14px; border-radius:16px; }
      .name { font-size:22px; }
      .state,.line { font-size:15px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <img class="boss-img" src="./equipment_enhance_great_success_banner_v1.png" alt="장비강화 대성공" />
    <section class="caption" aria-label="장비강화 대성공 설명">
      <h1 class="name">장비강화<span class="state">대성공</span></h1>
      <p class="line">강렬한 광채 속에서 장비가 기대 이상으로 각성합니다.</p>
    </section>
  </main>
</body>
</html>
